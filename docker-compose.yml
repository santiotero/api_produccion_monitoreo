services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - config/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - PHOENIX_ENDPOINT=http://phoenix:6006
    depends_on:
      - redis
      - phoenix
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  worker:
    build: .
    env_file:
      - config/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - PHOENIX_ENDPOINT=http://phoenix:6006
    depends_on:
      - redis
      - phoenix
    command: arq app.worker.WorkerSettings

  redis:
    image: redis:8
    ports:
      - "6379:6379"

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"
    env_file:
      - config/.env
